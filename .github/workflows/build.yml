name: NRI SDK
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  Build-Windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Deploy
        run: .\Scripts\Windows\1-Deploy.bat

      - name: Build
        run: .\Scripts\Windows\2-Build.bat

      - name: Prepare SDK
        run: .\Scripts\Windows\3-PrepareSDK.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NRI SDK (Windows x64)
          path: _NRI_SDK

  Build-Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libwayland-dev ninja-build

      - name: Deploy
        run: bash Scripts/Linux/1-Deploy.sh

      - name: Build
        run: bash Scripts/Linux/2-Build.sh

      - name: Prepare SDK
        run: bash Scripts/Linux/3-PrepareSDK.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NRI SDK (Linux x64)
          path: _NRI_SDK

  Build-macOS:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'

      - name: Install dependencies
        run: brew install ninja

      - name: Setup Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 'latest'
          cache: true

      - name: Deploy
        run: >-
          bash Scripts/MacOS/1-Deploy.sh
          -DNRI_ENABLE_NIS_SDK=ON
          -DNRI_ENABLE_IMGUI_EXTENSION=ON

      - name: Build
        run: bash Scripts/MacOS/2-Build.sh

      - name: Prepare SDK
        run: bash Scripts/MacOS/3-PrepareSDK.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NRI SDK (macOS ${{ runner.arch }})
          path: _NRI_SDK
